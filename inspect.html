<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bey inspector</title>
    <style>
      :root {
        --bg: #080c16;
        --panel: #0e1524;
        --line: #1e2a42;
        --ink: #dce6f7;
        --dim: #8698b8;
        --on: #2b6fd4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
        height: 100vh;
        display: grid;
        /* Roster, stage, detail. The stage takes whatever is left, so the
           model is always the biggest thing on the page. */
        grid-template-columns: 200px 1fr 232px;
        grid-template-rows: auto 1fr;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      header h1 { font-size: 14px; margin: 0 12px 0 0; letter-spacing: 0.08em; }
      header a { color: var(--dim); text-decoration: none; margin-left: auto; }
      header a:hover { color: var(--ink); }
      .group { display: flex; align-items: center; gap: 6px; }
      /* `hidden` is an attribute, not a rule, so any `display` set by a class
         beats it. Without this, hiding a group leaves it fully visible. */
      [hidden] { display: none !important; }
      .group > span { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }
      button {
        background: #16203a; color: var(--ink); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
      }
      button:hover { border-color: #39527f; }
      button.on { background: var(--on); border-color: var(--on); }

      nav, aside {
        background: var(--panel);
        overflow-y: auto;
        padding: 8px;
      }
      nav { border-right: 1px solid var(--line); }
      aside { border-left: 1px solid var(--line); }
      nav button { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
      nav h2, aside h2 {
        font-size: 10px; letter-spacing: 0.1em; color: var(--dim);
        margin: 10px 4px 6px; font-weight: 600;
      }
      #stage { position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #hint {
        position: absolute; left: 12px; bottom: 10px; color: var(--dim);
        font-size: 11px; pointer-events: none;
      }
      .row { display: flex; justify-content: space-between; padding: 3px 4px; }
      .row b { font-weight: 600; }
      .row span { color: var(--dim); }
      .part { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; }
      .part h3 { margin: 0 0 2px; font-size: 13px; }
      .part p { margin: 0 0 4px; color: var(--dim); font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>BEY INSPECTOR</h1>
      <div class="group" id="themes-group"><span>THEME</span><div id="themes"></div></div>
      <div class="group"><span>VIEW</span><button id="explode">Exploded</button><button id="spin" class="on">Spin</button></div>
      <a href="index.html">&larr; back to the game</a>
    </header>

    <nav>
      <h2>BEYBLADE</h2>
      <div id="roster"></div>
    </nav>

    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hint">drag to orbit &middot; scroll to zoom</div>
    </div>

    <aside>
      <h2>BUILD</h2>
      <div id="detail"></div>
    </aside>

    <script type="module" src="/src/inspect.ts"></script>
  </body>
</html>
